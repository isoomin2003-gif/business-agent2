# Render Blueprint (README '배포' 참고). 영구 디스크는 유료(Starter 이상) 플랜에서만 붙일 수 있습니다.
services:
  - type: web
    name: haru-hanjang
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: haru-data
      mountPath: /data
      sizeGB: 3
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-5.5
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
