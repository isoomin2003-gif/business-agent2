# Render Blueprint (README '배포' 참고) — 무료(Free) 플랜 설정
# 무료 플랜에는 영구 디스크가 없으므로, 기록은 Supabase에 보관합니다.
#   DATABASE_URL(Postgres) + SUPABASE_URL/SUPABASE_SECRET_KEY(비공개 Storage 버킷)를
#   Render Environment에 넣으면 재시작·재배포 후에도 게스트·일기·영상·소원이 남습니다.
#   이 값들이 없으면 컨테이너 안 SQLite(/data)를 쓰고, 재시작 때 초기화됩니다.
services:
  - type: web
    name: haru-hanjang
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    numInstances: 1
    # disk:
    #   name: haru-data
    #   mountPath: /data
    #   sizeGB: 3
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-5.5
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MAX_VIDEO_MB
        value: "50"
