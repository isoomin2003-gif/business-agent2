# Fly.io 배포 설정 (README '배포' 참고). app 이름은 본인 것으로 바꾸세요.
app = "haru-hanjang"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  OPENROUTER_MODEL = "anthropic/claude-haiku-5.5"

# SQLite DB와 업로드 영상을 보관할 영구 볼륨 (fly volumes create haru_data --size 3)
[[mounts]]
  source = "haru_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # 실시간 접속 상태(옥상·공원 인원, 라디오, 좌석)는 한 프로세스 메모리에 있으므로 머신 1대로 운영합니다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
